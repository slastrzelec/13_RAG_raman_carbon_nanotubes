# Runs both the FastAPI backend and the Streamlit UI together.
#
# Usage:
#   docker-compose up --build     # build images and start both services
#   docker-compose up             # start without rebuilding (after first build)
#   docker-compose down           # stop and remove containers
#
# Requires a .env file in this directory with OPENAI_API_KEY set.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    env_file:
      - .env
